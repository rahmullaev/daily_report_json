name: Daily Report Json

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # GitHub Actions cron uses UTC. Original schedule preserved.
    - cron: '0 2,10,13,16,19 * * *'

concurrency:
  group: daily-report-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. Checkout the repository, including history for data commits.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # 2. Python environment. 3.11 matches the local uv environment.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      # 3. Install ALL dependencies, including python-dotenv.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -c "from dotenv import load_dotenv; import requests, prettytable, telegram; print('Dependencies OK')"

      # 4. Create data directory if needed, preserving the original JSON.
      - name: Create data directory
        run: |
          mkdir -p data
          if [ ! -f data/weather_data.json ]; then
            echo '{}' > data/weather_data.json
          fi

      # 5. Validate syntax before running the live report.
      - name: Validate Python syntax
        run: |
          python -m compileall -q main.py settings.py logger.py weather.py namaz.py currency.py history.py storage.py alerts.py

      # 6. Generate report using GitHub Secrets (no .env file on runner).
      - name: Run full report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_IDS: ${{ secrets.TELEGRAM_USER_IDS }}
          OW_API_KEY: ${{ secrets.OW_API_KEY }}
          CITY_ID: ${{ secrets.CITY_ID }}
        run: |
          python main.py --mode FULL_REPORT --use-live

      # 7. Verify all three JSON files and their shared content.
      - name: Validate three JSON files
        run: |
          python - <<'PYVALIDATE'
          import json
          from pathlib import Path

          full = json.loads(Path('data/weather_data.json').read_text(encoding='utf-8'))
          current = json.loads(Path('data/weather_current.json').read_text(encoding='utf-8'))
          history = json.loads(Path('data/weather_history.json').read_text(encoding='utf-8'))
          assert isinstance(full, dict) and isinstance(current, dict) and isinstance(history, dict)
          assert all(k in current for k in ('weather', 'namaz', 'currency_rates'))
          assert all(k in history for k in ('temp_history', 'currency_history'))
          assert all(full.get(k) == v for k, v in {**current, **history}.items())
          print('OK: all three JSON files are consistent')
          PYVALIDATE

      # 8. Commit ONLY the generated JSON files to main.
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -- data/weather_data.json
          # These two files may be ignored by .gitignore.
          git add -f -- data/weather_current.json data/weather_history.json
          if git diff --cached --quiet; then
            echo "No JSON changes to commit"
          else
            git commit -m "Auto-update weather data [skip ci]"
            # Rebase onto the current main; never force-push.
            git pull --rebase origin main
            git push origin HEAD:main
            echo "JSON changes pushed to main"
          fi

      # 9. Publish the JSON data to the existing gh-pages branch.
      - name: Publish JSON to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./data
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

      # 10. Preserve logs and full JSON for troubleshooting.
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs
          if-no-files-found: warn
          path: |
            Log.log
            data/weather_data.json
